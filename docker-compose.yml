services:
  postgres:
    image: postgres:16-alpine
    container_name: padel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: padeldb
      POSTGRES_USER: padel
      POSTGRES_PASSWORD: padel1234
    ports:
      - "5433:5432"
    volumes:
      - padel_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U padel -d padeldb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: padel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - padel_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: padel-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/padeldb
      DB_USERNAME: padel
      DB_PASSWORD: padel1234
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Sobreescribir con secretos reales en el entorno de deploy.
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod-use-a-long-random-secret-1234567890}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-14400000}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-TEST-0000000000000000-000000-0000000000000000000000000000000-000000000}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@padelapp.com}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8081}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: padel-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  padel_postgres_data:
  padel_redis_data:
