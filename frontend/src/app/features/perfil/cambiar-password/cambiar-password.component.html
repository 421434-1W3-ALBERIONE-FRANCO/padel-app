<div class="min-h-screen bg-dark-950 text-white relative overflow-hidden">
  <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[800px] h-[350px] rounded-full bg-primary-500/5 blur-[120px] pointer-events-none"></div>

  <main class="max-w-lg mx-auto px-4 py-12 relative z-10">
    <ui-card class="p-6 sm:p-10">
      <h1 class="text-2xl font-extrabold text-white font-display mb-1">Cambiar Contraseña</h1>
      <p class="text-slate-400 text-sm mb-8">Actualizá la contraseña de tu cuenta.</p>

      <div *ngIf="errorMessage()"
           class="mb-5 p-4 rounded-xl bg-red-950/50 border border-red-800/50 text-red-100 text-sm">
        {{ errorMessage() }}
      </div>

      <div *ngIf="successMessage()"
           class="mb-5 p-4 rounded-xl bg-primary-950/50 border border-primary-800/50 text-primary-100 text-sm">
        {{ successMessage() }}
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">
        <div>
          <label for="passwordActual" class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">
            Contraseña actual
          </label>
          <input
            id="passwordActual"
            type="password"
            formControlName="passwordActual"
            class="w-full bg-slate-950/75 border border-slate-700/80 focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-white rounded-xl py-3 px-4 text-sm transition duration-200 outline-none"
            [class.border-red-500]="isFieldInvalid('passwordActual')"
          />
          <p *ngIf="isFieldInvalid('passwordActual')" class="mt-1.5 text-xs text-red-400">La contraseña actual es obligatoria.</p>
        </div>

        <div>
          <label for="passwordNueva" class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">
            Nueva contraseña
          </label>
          <input
            id="passwordNueva"
            type="password"
            formControlName="passwordNueva"
            class="w-full bg-slate-950/75 border border-slate-700/80 focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-white rounded-xl py-3 px-4 text-sm transition duration-200 outline-none"
            [class.border-red-500]="isFieldInvalid('passwordNueva')"
          />
          <p *ngIf="isFieldInvalid('passwordNueva')" class="mt-1.5 text-xs text-red-400">Debe tener al menos 6 caracteres.</p>
        </div>

        <div class="flex items-center gap-3">
          <button type="submit" [disabled]="isLoading()" class="btn-primary py-3.5 px-6">
            <span *ngIf="!isLoading()">Guardar Cambios</span>
            <span *ngIf="isLoading()">Guardando...</span>
          </button>
          <a routerLink="/dashboard" class="btn-secondary py-3.5 px-6">Volver</a>
        </div>
      </form>
    </ui-card>
  </main>
</div>
