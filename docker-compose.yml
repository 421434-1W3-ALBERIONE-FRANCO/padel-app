version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: padel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: padeldb
      POSTGRES_USER: padel
      POSTGRES_PASSWORD: padel1234
    ports:
      - "5433:5432"
    volumes:
      - padel_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U padel -d padeldb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: padel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - padel_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  padel_postgres_data:
  padel_redis_data:
