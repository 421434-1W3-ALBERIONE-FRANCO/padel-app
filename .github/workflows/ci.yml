name: CI

on:
  push:
    branches: [main]
  pull_request:

# Mínimo privilegio: el workflow solo lee el código.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (mvn verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Incluye los tests de integración (H2) y la validación de las migraciones contra un Postgres embebido.
      - name: Compilar y testear
        run: mvn -B -ntp verify

  frontend:
    name: Frontend (build, tests y auditoría)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build de producción
        run: npm run build
      - name: Tests
        run: npm test -- --watch=false --browsers=ChromeHeadless
      - name: Dependencias de producción sin vulnerabilidades altas
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Imágenes Docker
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validar docker-compose.yml
        run: cp .env.example .env && docker compose config --quiet
      - name: Imagen del backend
        run: docker build -t padelapp-backend:ci backend
      - name: Imagen del frontend
        run: docker build -t padelapp-frontend:ci frontend
