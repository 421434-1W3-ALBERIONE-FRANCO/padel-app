<div class="min-height-screen flex items-center justify-center p-4 md:p-8 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black">
  <div class="w-full max-w-md">

    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-primary-500 to-emerald-400 shadow-lg shadow-primary-500/20 mb-3">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-7 h-7 text-slate-950">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
        </svg>
      </div>
      <h1 class="text-2xl font-extrabold tracking-tight text-white sm:text-3xl">
        Elegí tu nueva contraseña
      </h1>
    </div>


    <div *ngIf="!tokenPresente()"
         class="mb-4 p-4 rounded-xl bg-red-950/50 border border-red-800 text-red-200 text-xs flex items-start space-x-3 shadow-lg">
      <span>El enlace no incluye un token válido. Solicitá uno nuevo desde "Recuperar contraseña".</span>
    </div>

    <div class="backdrop-blur-md bg-slate-900/60 border border-slate-800/80 rounded-3xl p-6 sm:p-8 shadow-2xl">
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
        <div>
          <label for="passwordNueva" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Nueva contraseña</label>
          <input
            id="passwordNueva"
            type="password"
            formControlName="passwordNueva"
            placeholder="••••••••"
            class="w-full bg-slate-950/60 border border-slate-800 focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-white rounded-xl py-2.5 px-4 text-sm transition duration-200 outline-none"
            [class.border-red-500]="isFieldInvalid('passwordNueva')"
          />
          <p *ngIf="isFieldInvalid('passwordNueva')" class="mt-1 text-xs text-red-400">Debe tener al menos 6 caracteres.</p>
        </div>

        <button
          type="submit"
          [disabled]="isLoading() || !tokenPresente()"
          class="w-full relative flex items-center justify-center py-3.5 px-4 rounded-xl text-slate-950 font-bold bg-gradient-to-r from-primary-400 to-emerald-400 hover:from-primary-300 hover:to-emerald-300 active:scale-98 transition duration-200 disabled:opacity-50 disabled:scale-100 disabled:cursor-not-allowed shadow-lg shadow-primary-500/10 mt-2 cursor-pointer"
        >
          <span *ngIf="!isLoading()">Restablecer contraseña</span>
          <span *ngIf="isLoading()">Guardando...</span>
        </button>
      </form>

      <div class="mt-6 text-center">
        <p class="text-xs text-slate-400">
          <a routerLink="/auth/login" class="text-primary-400 hover:text-primary-300 hover:underline font-semibold transition duration-150 cursor-pointer">
            Volver a iniciar sesión
          </a>
        </p>
      </div>
    </div>
  </div>
</div>
