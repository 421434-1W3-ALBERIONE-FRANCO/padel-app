spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/padeldb}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:padel}
    password: ${DB_PASSWORD:padel1234}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: false
    out-of-order: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

logging:
  level:
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

# Defaults SOLO para desarrollo local. Sobreescribir siempre vía variable de entorno.
jwt:
  secret: ${JWT_SECRET:dev-only-local-secret-do-not-use-in-production-1234567890}

mercadopago:
  access-token: ${MP_ACCESS_TOKEN:TEST-0000000000000000-000000-0000000000000000000000000000000-000000000}
