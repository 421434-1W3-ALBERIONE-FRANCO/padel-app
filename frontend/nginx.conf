# Este archivo se incluye dentro del bloque http de nginx (conf.d/default.conf).

# Login, registro y recuperación de contraseña: 10 pedidos por minuto por IP, con ráfaga de 10.
# El backend tiene sus propios límites; este corta la fuerza bruta antes de llegar a Tomcat.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_status 429;

# El header Connection del WebSocket solo pide upgrade cuando el cliente lo pidió.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # La API solo recibe JSON chico (no hay subida de archivos).
    client_max_body_size 1m;

    # Si delante hay otro proxy (el que termina TLS), $remote_addr sería la IP de ese proxy y todos los
    # clientes compartirían el límite por IP. En ese caso, descomentar indicando la red del proxy:
    # set_real_ip_from 172.16.0.0/12;
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cabeceras de seguridad. Las locations de abajo no usan add_header, así que todas las heredan.
    # style-src necesita 'unsafe-inline' porque Angular inyecta los estilos de los componentes en <style>.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' ws://$http_host wss://$http_host blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Los navegadores la ignoran por HTTP; sirve cuando el sitio se publica con TLS.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Hacia el backend se manda la IP real pisando (no agregando) la que diga el cliente: así nadie puede
    # inventarse la IP con la que se aplican los límites por IP y la restricción de red del fichaje.
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://backend:8080;
    }

    location /api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://backend:8080;
    }

    # WebSocket de disponibilidad y notificaciones. Define sus propios headers, así que repite los de arriba.
    location /ws {
        proxy_pass http://backend:8080;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    # Archivos ocultos (.git, .env, ...) nunca.
    location ~ /\.(?!well-known) {
        deny all;
    }

    # index.html no se cachea: un deploy nuevo se ve con solo recargar.
    location = /index.html {
        expires -1;
    }

    # JS y CSS llevan hash de contenido en el nombre: cache largo.
    location ~* \.(?:js|css)$ {
        expires 1y;
        try_files $uri =404;
    }

    # El resto de los assets (assets/, favicon, modelos 3D) no lleva hash: cache corto.
    location ~* \.(?:woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|glb)$ {
        expires 7d;
        try_files $uri =404;
    }

    # SPA: cualquier ruta desconocida sirve index.html (Angular Router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
