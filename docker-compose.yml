# Stack completo para un servidor (perfil prod). Los secretos salen de .env (copiar .env.example): si falta
# uno obligatorio, compose no arranca. Solo se publica el frontend (nginx), que sirve la SPA y hace de proxy
# a la API y al WebSocket; Postgres, Redis y el backend quedan dentro de la red de Docker.
# Para desarrollo local usar docker-compose.dev.yml (solo Postgres y Redis).
name: padelapp

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-padeldb}
      POSTGRES_USER: ${POSTGRES_USER:-padel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Definí REDIS_PASSWORD en .env}", "--appendonly", "yes"]
    environment:
      # redis-cli toma la clave de acá para el healthcheck.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-padeldb}
      DB_USERNAME: ${POSTGRES_USER:-padel}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Definí JWT_SECRET en .env (al menos 32 caracteres aleatorios)}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-14400000}
      FRONTEND_URL: ${FRONTEND_URL:?Definí FRONTEND_URL en .env (URL pública del sitio)}
      CORS_ALLOWED_ORIGINS: ${FRONTEND_URL}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:?Definí MP_ACCESS_TOKEN en .env}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      MP_WEBHOOK_TOLERANCIA_SEGUNDOS: ${MP_WEBHOOK_TOLERANCIA_SEGUNDOS:-0}
      MP_POINT_DEVICE_ID: ${MP_POINT_DEVICE_ID:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@padelapp.com}
      AUTH_VERIFICACION_EMAIL: ${AUTH_VERIFICACION_EMAIL:-true}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-whatsapp:+14155238886}
      CONTROL_HORARIO_REDES: ${CONTROL_HORARIO_REDES:-}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Argentina/Buenos_Aires}
    # Sin "ports": solo lo alcanza nginx. Las métricas (/actuator/prometheus) quedan en el 8081 interno.
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # En producción poner delante un proxy con TLS (Caddy, Traefik) y publicar solo en 127.0.0.1.
      - "${HTTP_PORT:-8081}:8080"

  # Backup diario de la base en ./backups (formato de pg_dump -Fc, se restaura con pg_restore; ver README).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-padeldb}
      PGUSER: ${POSTGRES_USER:-padel}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./deploy/backup/pg-backup.sh:/usr/local/bin/pg-backup.sh:ro
      - ./backups:/backups
    entrypoint: ["sh", "/usr/local/bin/pg-backup.sh"]

volumes:
  postgres_data:
  redis_data:
